[package]
name = "stackmynd"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Local-First Multi-Workspace Block-Level Markdown Knowledge Base"
license = "GPL-3.0-only"

[lib]
name = "stackmynd_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
notify = { version = "8", features = ["macos_fsevent"] }
notify-debouncer-mini = "0.6"
rusqlite = { version = "0.33", features = ["bundled", "backup"] }
tantivy = "0.22"
blake3 = "1.5"
uuid = { version = "1", features = ["v4", "serde"] }
pulldown-cmark = { version = "0.13", features = ["simd"] }
rayon = "1.10"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
